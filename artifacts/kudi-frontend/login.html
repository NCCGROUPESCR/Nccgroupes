<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Archanda AG</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .auth-wrap{ min-height:100vh; display:grid; grid-template-columns: 1fr 1fr; }
  .auth-side{ background: var(--ink); color: var(--paper-white); padding: var(--sp-6); display:flex; flex-direction:column; justify-content:space-between; }
  .auth-side .quote{ font-family: var(--font-display); font-size: var(--step-2); max-width: 26ch; line-height:1.3; }
  .auth-form-col{ display:flex; align-items:center; justify-content:center; padding: var(--sp-6); }
  .auth-box{ width:100%; max-width: 400px; }
  @media (max-width:860px){
    .auth-wrap{ grid-template-columns:minmax(0,1fr); }
    .auth-side{ display:none; }
    .auth-form-col{ padding:var(--sp-5) var(--sp-4); }
  }
</style>
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-side">
    <a href="index.html" class="brand ncc-logo-applied" style="color:var(--paper-white);"><img src="archanda-logo-light.svg" alt="Archanda AG Trading" class="ncc-wordmark"></a>
    <p class="quote">Trading for cross-border business transactions, with clear payment terms and conditional releases.</p>
  </aside>
  <div class="auth-form-col">
    <div class="auth-box">
      <span class="eyebrow">Welcome back</span>
      <h1 style="font-size:var(--step-3); margin-top:0.4rem;">Log in to your account</h1>
      <form id="login-form" style="margin-top:var(--sp-5);">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
          <div class="hint">Forgot it? <a href="#" style="color:var(--seal);">Reset password</a></div>
        </div>
        <button type="submit" class="btn btn-seal btn-block">Log in</button>
      </form>
      <p style="margin-top:var(--sp-5); font-size:0.88rem; color:var(--muted);">New to Archanda AG? <a href="signup.html" style="color:var(--seal); font-weight:600;">Create an account</a></p>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/lang-modal.js"></script>
<script>window.KE_API_BASE = "%VITE_API_BASE_URL%";</script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
function ke_routeForRole(role){
  const map = {
    buyer:'dashboard-buyer.html', seller:'dashboard-seller.html',
    support:'dashboard-support.html', admin:'dashboard-support.html', developer:'developer.html'
  };
  return map[role] || 'index.html';
}

function doLogin(email, password){
  var btn = document.querySelector('#login-form button[type="submit"]');
  if (btn){ btn.disabled = true; btn.textContent = 'Logging in…'; }
  ke_api('/v1/auth/login', {
    method: 'POST',
    body: JSON.stringify({ email: email, password: password })
  }).then(function(data){
    ke_login(data.user, { accessToken: data.accessToken, refreshToken: data.refreshToken });
    window.location.href = ke_routeForRole(data.user.role);
  }).catch(function(err){
    ke_toast(err.message || 'That email and password combination doesn\'t match an account.');
  }).finally(function(){
    if (btn){ btn.disabled = false; btn.textContent = 'Log in'; }
  });
}

document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  doLogin(
    document.getElementById('email').value.trim(),
    document.getElementById('password').value
  );
});


</script>
</body>
</html>
